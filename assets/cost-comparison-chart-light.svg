<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="840" height="400" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="1" />

  <!-- Header -->
  <text x="40" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#1f2328">
    톡서랍 2년 누적 구독료 vs ReTalk 1회 평생 소장
  </text>
  <text x="40" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#656d76">
    시간이 갈수록 구독료는 계속 올라가지만, ReTalk은 29,000원 1회 결제로 평생 내 컴퓨터에 보관됩니다.
  </text>

  <!-- Golden Cross Shaded Zone (5m ~ 15m) -->
  <rect x="194.8" y="78" width="241.3" height="252" fill="rgba(26, 127, 55, 0.05)" />
  <line x1="194.8" y1="100" x2="194.8" y2="330" stroke="#1a7f37" stroke-dasharray="2,3" stroke-width="1" opacity="0.4" />
  <line x1="436.1" y1="100" x2="436.1" y2="330" stroke="#1a7f37" stroke-dasharray="2,3" stroke-width="1" opacity="0.4" />

  <!-- Golden Cross Pill Indicator -->
  <g transform="translate(205.5, 78)">
    <rect width="220" height="22" rx="11" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <text x="110" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#1f883d" text-anchor="middle">
      ⚡ 골든 크로스: 5개월 ~ 15개월 차 역전
    </text>
  </g>

  <!-- Y Grid lines -->
  <line x1="80" y1="90.0" x2="640.0" y2="90.0" stroke="#f0f2f5" stroke-width="1" />
  <text x="70" y="94.0" font-family="sans-serif" font-size="10.5" fill="#8c959f" text-anchor="end">15만</text>

  <line x1="80" y1="170.0" x2="640.0" y2="170.0" stroke="#f0f2f5" stroke-width="1" />
  <text x="70" y="174.0" font-family="sans-serif" font-size="10.5" fill="#8c959f" text-anchor="end">10만</text>

  <line x1="80" y1="250.0" x2="640.0" y2="250.0" stroke="#f0f2f5" stroke-width="1" />
  <text x="70" y="254.0" font-family="sans-serif" font-size="10.5" fill="#8c959f" text-anchor="end">5만</text>

  <!-- 0 KRW Baseline -->
  <line x1="80" y1="330" x2="640.0" y2="330" stroke="#e1e4e8" stroke-width="1" />
  <text x="70" y="334" font-family="sans-serif" font-size="10.5" fill="#8c959f" text-anchor="end">0원</text>

  <!-- X Axis Months -->
  <text x="80.0" y="352" font-family="sans-serif" font-size="11" fill="#8c959f" text-anchor="middle">시작</text>
  <text x="194.8" y="352" font-family="sans-serif" font-size="11" font-weight="700" fill="#cf222e" text-anchor="middle">5개월</text>
  <text x="360.0" y="352" font-family="sans-serif" font-size="11" fill="#8c959f" text-anchor="middle">1년</text>
  <text x="436.1" y="352" font-family="sans-serif" font-size="11" font-weight="700" fill="#bf8700" text-anchor="middle">15개월</text>
  <text x="640.0" y="352" font-family="sans-serif" font-size="11" fill="#8c959f" text-anchor="middle">2년</text>

  <!-- ==================== RETALK 29,000 KRW HERO LINE ==================== -->
  <!-- 1. Y-axis Badge -->
  <rect x="12" y="274.6" width="60" height="18" rx="4" fill="#1a7f37"/>
  <text x="42" y="287.6" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">29,000원</text>

  <!-- 2. Clean Horizontal Baseline -->
  <line x1="80" y1="283.6" x2="640.0" y2="283.6" stroke="#1a7f37" stroke-width="2.5" />

  <!-- 3. Right End Label -->
  <circle cx="640.0" cy="283.6" r="4.5" fill="#1f883d" stroke="#ffffff" stroke-width="1.5" />
  <text x="650.0" y="287.6" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f883d">
    ReTalk 평생 소장 (29,000원 고정)
  </text>
  <!-- ====================================================================== -->

  <!-- 톡서랍 1: 500GB (Red) -->
  <line x1="80.0" y1="330.0" x2="640.0" y2="103.4" stroke="#cf222e" stroke-width="2" stroke-linecap="round" />
  <circle cx="194.8" cy="283.6" r="3.5" fill="#cf222e" stroke="#ffffff" stroke-width="1" />
  <text x="650.0" y="107.4" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#cf222e">
    톡서랍 500GB (14.2만)
  </text>

  <!-- 톡서랍 2: 250GB (Warm Orange/Gold) -->
  <line x1="80.0" y1="330.0" x2="640.0" y2="180.2" stroke="#bf8700" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5,4" />
  <circle cx="253.6" cy="283.6" r="3" fill="#bf8700" stroke="#ffffff" stroke-width="1" />
  <text x="650.0" y="184.2" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#bf8700">
    톡서랍 250GB (9.4만)
  </text>

  <!-- 톡서랍 3: 100GB (Neutral Slate) -->
  <line x1="80.0" y1="330.0" x2="640.0" y2="257.0" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="436.1" cy="283.6" r="3.5" fill="#6e7681" stroke="#ffffff" stroke-width="1" />
  <text x="650.0" y="261.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6e7681">
    톡서랍 100GB (4.6만)
  </text>

  <!-- Footer Note: Quiet and subtle -->
  <text x="40" y="380" font-family="sans-serif" font-size="10.5" fill="#656d76">
    * 톡서랍은 구독 해지 시 유예기간 후 전체 데이터가 영구 삭제되지만, ReTalk은 추가 비용 없이 평생 소장됩니다.
  </text>
</svg>