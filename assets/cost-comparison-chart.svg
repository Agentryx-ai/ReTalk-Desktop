<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="retalkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="860" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    카카오 톡서랍 플러스 vs ReTalk 3년 누적 비용 비교
  </text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    톡서랍은 구독 해지 시 데이터가 영구 삭제되지만, ReTalk은 1회 29,000원으로 내 컴퓨터에 평생 소장됩니다.
  </text>

  <!-- Chart Area -->
  <!-- X origin: 90, width: 680 (X: 90 to 770). 36 months total. 680 / 36 = 18.88 px/month -->
  <!-- Y origin: 390 (0 KRW), height: 280 (Y: 390 to 110). 250,000 KRW max. 280 / 250000 = 0.00112 px/KRW -->

  <!-- Grid Lines & Y Labels -->
  <!-- 0 KRW (Y=390) -->
  <line x1="90" y1="390" x2="780" y2="390" stroke="#334155" stroke-width="1"/>
  <text x="80" y="394" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">0원</text>

  <!-- 50,000 KRW (Y=334) -->
  <line x1="90" y1="334" x2="780" y2="334" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="338" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">5만</text>

  <!-- 100,000 KRW (Y=278) -->
  <line x1="90" y1="278" x2="780" y2="278" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="282" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">10만</text>

  <!-- 150,000 KRW (Y=222) -->
  <line x1="90" y1="222" x2="780" y2="222" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="226" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">15만</text>

  <!-- 200,000 KRW (Y=166) -->
  <line x1="90" y1="166" x2="780" y2="166" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="170" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">20만</text>

  <!-- X Axis Labels -->
  <!-- 0m (90) -->
  <text x="90" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">시작</text>
  <!-- 6m (90 + 113 = 203) -->
  <line x1="203" y1="390" x2="203" y2="395" stroke="#475569" stroke-width="1"/>
  <text x="203" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">6개월</text>

  <!-- 12m (90 + 227 = 317) -->
  <line x1="317" y1="390" x2="317" y2="395" stroke="#475569" stroke-width="1"/>
  <text x="317" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">1년</text>

  <!-- 15m Golden Cross (90 + 283 = 373) -->
  <line x1="373" y1="120" x2="373" y2="390" stroke="#f59e0b" stroke-dasharray="3,3" stroke-width="1.5" opacity="0.8"/>
  <text x="373" y="415" font-family="sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">15개월★</text>

  <!-- 24m (90 + 453 = 543) -->
  <line x1="543" y1="390" x2="543" y2="395" stroke="#475569" stroke-width="1"/>
  <text x="543" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">2년</text>

  <!-- 36m (90 + 680 = 770) -->
  <line x1="770" y1="390" x2="770" y2="395" stroke="#475569" stroke-width="1"/>
  <text x="770" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">3년</text>

  <!-- LINES -->
  <!-- 1. TalkDrawer 500GB (5,900 KRW/mo) -->
  <!-- 0m: 390. 12m: 390 - (70800 * 0.00112) = 310.7. 24m: 390 - 158.5 = 231.5. 36m: 390 - 237.8 = 152.2 -->
  <polyline points="90,390 203,350 317,311 543,231 770,152" fill="none" stroke="#ef4444" stroke-width="2.5" />
  <circle cx="770" cy="152" r="4" fill="#ef4444"/>
  <text x="778" y="156" font-family="sans-serif" font-size="12" font-weight="600" fill="#ef4444">톡서랍 500GB (212,400원)</text>

  <!-- 2. TalkDrawer 250GB (3,900 KRW/mo) -->
  <!-- 0m: 390. 12m: 390 - 52.4 = 337.6. 24m: 390 - 104.8 = 285.2. 36m: 390 - 157.2 = 232.8 -->
  <polyline points="90,390 203,363 317,337 543,285 770,233" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,3" />
  <circle cx="770" cy="233" r="3.5" fill="#f43f5e"/>
  <text x="778" y="237" font-family="sans-serif" font-size="12" font-weight="600" fill="#f43f5e">톡서랍 250GB (140,400원)</text>

  <!-- 3. TalkDrawer 100GB (1,900 KRW/mo) -->
  <!-- 0m: 390. 12m: 390 - 25.5 = 364.5. 15m: 390 - 31.9 = 358.1. 24m: 390 - 51.0 = 339.0. 36m: 390 - 76.6 = 313.4 -->
  <polyline points="90,390 203,377 317,364 373,358 543,339 770,313" fill="none" stroke="#f97316" stroke-width="2.5" />
  <circle cx="373" cy="358" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <circle cx="770" cy="313" r="4" fill="#f97316"/>
  <text x="778" y="317" font-family="sans-serif" font-size="12" font-weight="600" fill="#f97316">톡서랍 100GB (68,400원)</text>

  <!-- 4. ReTalk Archive (29,000 KRW Flat) -->
  <!-- Y = 390 - (29000 * 0.00112) = 357.5 -->
  <!-- Horizontal line across entire range -->
  <line x1="90" y1="357.5" x2="770" y2="357.5" stroke="url(#retalkGlow)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="90" cy="357.5" r="5" fill="#10b981"/>
  <circle cx="373" cy="357.5" r="5" fill="#10b981" stroke="#fff" stroke-width="1.5"/>
  <circle cx="770" cy="357.5" r="6" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <text x="778" y="362" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">★ ReTalk 평생 소장 (29,000원 고정)</text>

  <!-- Golden Cross Callout Card -->
  <g transform="translate(305, 115)">
    <rect width="180" height="62" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">⚡ 15개월 골든 크로스</text>
    <text x="90" y="44" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">가장 저렴한 100GB 요금제도</text>
    <text x="90" y="56" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">15개월이면 ReTalk 돌파!</text>
  </g>

  <!-- Key Highlight Footer Badges -->
  <g transform="translate(90, 435)">
    <rect width="320" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="160" y="20" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">
      ⚠️ 톡서랍: 구독 해지 시 모든 백업 데이터 영구 삭제
    </text>
  </g>
  <g transform="translate(430, 435)">
    <rect width="340" height="30" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="170" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">
      🛡️ ReTalk: 1회 결제로 내 컴퓨터 파일 영구 보존 (구독료 0원)
    </text>
  </g>
</svg>