<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="860" height="480" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">
    카카오 톡서랍 플러스 vs ReTalk 2년 누적 비용 비교
  </text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    톡서랍은 구독 해지 시 유예기간 후 데이터가 삭제되지만, ReTalk은 1회 29,000원으로 내 PC에 평생 남습니다.
  </text>

  <!-- Golden Cross Highlight Zone (5m to 15.3m) -->
  <rect x="218.9" y="105" width="249.9" height="285" fill="rgba(245, 158, 11, 0.07)" rx="4" />
  <line x1="218.9" y1="105" x2="218.9" y2="390" stroke="#f59e0b" stroke-dasharray="3,3" stroke-width="1.2" opacity="0.6"/>
  <line x1="468.8" y1="105" x2="468.8" y2="390" stroke="#f59e0b" stroke-dasharray="3,3" stroke-width="1.2" opacity="0.6"/>

  <!-- Y Grid & Labels -->
  <!-- 0 KRW -->
  <line x1="90" y1="390" x2="690" y2="390" stroke="#334155" stroke-width="1"/>
  <text x="80" y="394" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">0원</text>

  <!-- 50,000 KRW -->
  <line x1="90" y1="296.7" x2="690" y2="296.7" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="300.7" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">5만</text>

  <!-- 100,000 KRW -->
  <line x1="90" y1="203.3" x2="690" y2="203.3" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="207.3" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">10만</text>

  <!-- 150,000 KRW -->
  <line x1="90" y1="110.0" x2="690" y2="110.0" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="114.0" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">15만</text>

  <!-- X Axis Labels -->
  <text x="100.0" y="414" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">시작</text>
  <text x="218.9" y="414" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">5개월</text>
  <text x="390.0" y="414" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">1년</text>
  <text x="468.8" y="414" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">15개월</text>
  <text x="680.0" y="414" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">2년</text>

  <!-- ==================== RETALK 29,000 KRW HORIZONTAL LINE ==================== -->
  <!-- 1. Y-axis Badge for 29,000 KRW -->
  <rect x="18" y="325.9" width="68" height="20" rx="4" fill="#059669"/>
  <text x="52" y="339.9" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">29,000원</text>

  <!-- 2. The Full Horizontal Reference Line (NO FILTER TO PREVENT CLIPPING!) -->
  <line x1="90" y1="335.9" x2="685" y2="335.9" stroke="#10b981" stroke-width="3" />
  <circle cx="100.0" cy="335.9" r="4" fill="#10b981"/>
  <circle cx="680.0" cy="335.9" r="5.5" fill="#10b981" stroke="#fff" stroke-width="1.5"/>

  <!-- 3. In-chart Label above the line -->
  <rect x="108.0" y="311.9" width="210" height="18" rx="3" fill="rgba(15,23,42,0.8)"/>
  <text x="112.0" y="324.9" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#10b981">
    ★ ReTalk 평생 소장 (29,000원 고정)
  </text>
  <!-- ========================================================================= -->

  <!-- 1. TalkDrawer 500GB (5,900/m) -->
  <polyline points="100.0,390.0 218.9,335.9 390.0,257.8 680.0,125.7" fill="none" stroke="#ef4444" stroke-width="2.5" />
  <circle cx="218.9" cy="335.9" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <circle cx="680.0" cy="125.7" r="4" fill="#ef4444"/>
  <text x="690.0" y="129.7" font-family="sans-serif" font-size="12" font-weight="600" fill="#ef4444">톡서랍 500GB (14.2만)</text>

  <!-- 2. TalkDrawer 250GB (3,900/m) -->
  <polyline points="100.0,390.0 279.8,335.9 390.0,302.6 680.0,215.3" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5,3" />
  <circle cx="279.8" cy="335.9" r="4.5" fill="#f43f5e" stroke="#fff" stroke-width="1.5"/>
  <circle cx="680.0" cy="215.3" r="4" fill="#f43f5e"/>
  <text x="690.0" y="219.3" font-family="sans-serif" font-size="12" font-weight="600" fill="#f43f5e">톡서랍 250GB (9.4만)</text>

  <!-- 3. TalkDrawer 100GB (1,900/m) -->
  <polyline points="100.0,390.0 390.0,347.4 468.8,335.9 680.0,304.9" fill="none" stroke="#f97316" stroke-width="2.5" />
  <circle cx="468.8" cy="335.9" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <circle cx="680.0" cy="304.9" r="4" fill="#f97316"/>
  <text x="690.0" y="308.9" font-family="sans-serif" font-size="12" font-weight="600" fill="#f97316">톡서랍 100GB (4.6만)</text>

  <!-- End of ReTalk line right label -->
  <text x="690.0" y="339.9" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981">ReTalk (2.9만 고정)</text>

  <!-- Golden Cross Info Card (Placed safely in open upper-left quadrant) -->
  <g transform="translate(105, 95)">
    <rect width="240" height="50" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="120" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#f59e0b" text-anchor="middle">
      ⚡ 골든 크로스: 최소 5개월 ~ 최대 15개월
    </text>
    <text x="120" y="38" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">
      가장 저렴한 100GB도 15개월이면 ReTalk 돌파
    </text>
  </g>

  <!-- Footer Badges -->
  <g transform="translate(90, 434)">
    <rect width="320" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="160" y="19" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">
      ⚠️ 톡서랍: 해지 시 유예기간 후 백업 데이터 영구 삭제
    </text>
  </g>
  <g transform="translate(425, 434)">
    <rect width="335" height="30" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="167" y="19" font-family="sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">
      🛡️ ReTalk: 1회 29,000원으로 내 PC에 평생 영구 보존
    </text>
  </g>
</svg>