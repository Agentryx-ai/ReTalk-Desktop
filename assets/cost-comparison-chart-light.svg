<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <filter id="shadow_light" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="860" height="480" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#0f172a">
    카카오 톡서랍 플러스 vs ReTalk 2년 누적 비용 비교
  </text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b">
    톡서랍은 구독 해지 시 유예기간 후 데이터가 삭제되지만, ReTalk은 1회 29,000원으로 내 PC에 평생 남습니다.
  </text>

  <!-- Golden Cross Highlight Zone (5m to 15.3m) -->
  <rect x="223.3" y="110" width="274.7" height="280" fill="rgba(245, 158, 11, 0.12)" rx="4" />
  <line x1="223.3" y1="110" x2="223.3" y2="390" stroke="#f59e0b" stroke-dasharray="3,3" stroke-width="1.2" opacity="0.6"/>
  <line x1="498.0" y1="110" x2="498.0" y2="390" stroke="#f59e0b" stroke-dasharray="3,3" stroke-width="1.2" opacity="0.6"/>

  <!-- Y Grid & Labels -->
  <!-- 0 KRW -->
  <line x1="90" y1="390" x2="740" y2="390" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="394" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">0원</text>

  <!-- 50,000 KRW -->
  <line x1="90" y1="302.5" x2="740" y2="302.5" stroke="#f1f5f9" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="306.5" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">5만</text>

  <!-- 100,000 KRW -->
  <line x1="90" y1="215.0" x2="740" y2="215.0" stroke="#f1f5f9" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="219.0" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">10만</text>

  <!-- 150,000 KRW -->
  <line x1="90" y1="127.5" x2="740" y2="127.5" stroke="#f1f5f9" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="80" y="131.5" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">15만</text>

  <!-- X Axis Labels -->
  <text x="90.0" y="414" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">시작</text>
  <text x="223.3" y="414" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">5개월</text>
  <text x="410.0" y="414" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">1년</text>
  <text x="498.0" y="414" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">15개월</text>
  <text x="730.0" y="414" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">2년</text>

  <!-- 1. TalkDrawer 500GB (5,900/m) -->
  <polyline points="90.0,390.0 223.3,338.4 410.0,266.1 730.0,142.2" fill="none" stroke="#ef4444" stroke-width="2.5" />
  <circle cx="223.3" cy="338.4" r="4" fill="#ef4444" stroke="#fff" stroke-width="1"/>
  <circle cx="730.0" cy="142.2" r="4" fill="#ef4444"/>
  <text x="738.0" y="146.2" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#ef4444">톡서랍 500GB (14.1만)</text>

  <!-- 2. TalkDrawer 250GB (3,900/m) -->
  <polyline points="90.0,390.0 287.3,339.2 410.0,308.1 730.0,226.2" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5,3" />
  <circle cx="287.3" cy="339.2" r="3.5" fill="#f43f5e" stroke="#fff" stroke-width="1"/>
  <circle cx="730.0" cy="226.2" r="4" fill="#f43f5e"/>
  <text x="738.0" y="230.2" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#f43f5e">톡서랍 250GB (9.3만)</text>

  <!-- 3. TalkDrawer 100GB (1,900/m) -->
  <polyline points="90.0,390.0 410.0,350.1 498.0,339.2 730.0,310.2" fill="none" stroke="#f97316" stroke-width="2.5" />
  <circle cx="498.0" cy="339.2" r="4.5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <circle cx="730.0" cy="310.2" r="4" fill="#f97316"/>
  <text x="738.0" y="314.2" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#f97316">톡서랍 100GB (4.5만)</text>

  <!-- 4. ReTalk Archive Flat Reference Line (29,000 KRW) -->
  <line x1="90" y1="339.2" x2="740" y2="339.2" stroke="#10b981" stroke-width="3.5" filter="url(#shadow_light)"/>
  <circle cx="90" cy="339.2" r="4.5" fill="#10b981"/>
  <circle cx="730.0" cy="339.2" r="5.5" fill="#10b981" stroke="#fff" stroke-width="1.5"/>
  <text x="738.0" y="343.2" font-family="sans-serif" font-size="12" font-weight="700" fill="#059669">★ ReTalk (2.9만 평생 고정)</text>

  <!-- Golden Cross Info Card -->
  <g transform="translate(230, 95)" filter="url(#shadow_light)">
    <rect width="250" height="52" rx="7" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="125" y="21" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#f59e0b" text-anchor="middle">
      ⚡ 골든 크로스: 최소 5개월 ~ 최대 15개월
    </text>
    <text x="125" y="39" font-family="sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">
      가장 저렴한 요금제도 15개월이면 ReTalk 가격을 넘습니다
    </text>
  </g>

  <!-- Footer Badges -->
  <g transform="translate(90, 434)">
    <rect width="320" height="30" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="160" y="19" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">
      ⚠️ 톡서랍: 해지 시 유예기간 후 백업 데이터 영구 삭제
    </text>
  </g>
  <g transform="translate(425, 434)">
    <rect width="335" height="30" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="167" y="19" font-family="sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">
      🛡️ ReTalk: 1회 29,000원으로 내 PC에 평생 영구 보존
    </text>
  </g>
</svg>